<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interface Estilo GitHub</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Navbar */
    header {
      background-color: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo {
      fill: #f0f6fc;
      width: 32px;
      height: 32px;
    }

    .search-input {
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 5px 12px;
      color: #c9d1d9;
      font-size: 14px;
      width: 240px;
    }

    .search-input:focus {
      outline: none;
      border-color: #58a6ff;
    }

    /* Main Container */
    main {
      max-width: 1200px;
      width: 100%;
      margin: 24px auto;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 24px;
    }

    /* Sidebar Profile */
    .profile-card {
      text-align: center;
    }

    .avatar {
      width: 100%;
      max-width: 260px;
      border-radius: 50%;
      border: 1px solid #30363d;
    }

    .profile-name {
      font-size: 24px;
      font-weight: 600;
      color: #f0f6fc;
      margin-top: 16px;
    }

    .profile-username {
      font-size: 20px;
      color: #8b949e;
      font-weight: 300;
    }

    .btn-edit {
      width: 100%;
      background-color: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 6px 12px;
      font-weight: 500;
      margin-top: 16px;
      cursor: pointer;
    }

    .btn-edit:hover {
      background-color: #30363d;
      border-color: #8b949e;
    }

    /* Content Area */
    .repo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }

    .repo-card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .repo-title {
      color: #58a6ff;
      font-weight: 600;
      text-decoration: none;
      font-size: 14px;
    }

    .repo-title:hover {
      text-decoration: underline;
    }

    .repo-desc {
      font-size: 12px;
      color: #8b949e;
      margin: 8px 0 16px 0;
    }

    .repo-meta {
      font-size: 12px;
      color: #8b949e;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .lang-color {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
      background-color: #f1e05a; /* JavaScript yellow */
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-left">
      <svg class="logo" viewBox="0 0 16 16" version="1.1" aria-hidden="true">
        <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
      </svg>
      <input type="text" class="search-input" placeholder="Type / to search">
    </div>
  </header>

  <main>
    <!-- Sidebar -->
    <aside class="profile-card">
      <img class="avatar" src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" alt="Avatar">
      <h1 class="profile-name">Nome do Usuário</h1>
      <p class="profile-username">username</p>
      <button class="btn-edit">Edit profile</button>
    </aside>

    <!-- Main Repositories Content -->
    <section>
      <h2 style="font-size: 16px; font-weight: 600; color: #f0f6fc;">Popular repositories</h2>
      <div class="repo-grid">
       
        <div class="repo-card">
          <div>
            <a href="#" class="repo-title">meu-projeto-awesome</a>
            <p class="repo-desc">Uma aplicação web completa criada com HTML, CSS e JavaScript.</p>
          </div>
          <div class="repo-meta">
            <span><span class="lang-color"></span> JavaScript</span>
            <span>★ 12</span>
          </div>
        </div>

        <div class="repo-card">
          <div>
            <a href="#" class="repo-title">api-rest-node</a>
            <p class="repo-desc">Backend construído para gerenciamento de dados do sistema.</p>
          </div>
          <div class="repo-meta">
            <span><span class="lang-color" style="background-color: #3178c6;"></span> TypeScript</span>
            <span>★ 5</span>
          </div>
        </div>

      </div>
    </section>
  </main>

</body>
</html>
